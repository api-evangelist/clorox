description: >-
  The Clorox Company is a multinational consumer-goods manufacturer best
  known for its bleach, cleaning, and disinfecting brands as well as a
  broader portfolio that includes Pine-Sol, Liquid-Plumr, Glad, Kingsford,
  Brita, Burts Bees, and Hidden Valley. Clorox does not publish a public
  developer-facing REST API; integration with the company is handled
  through partner, supply-chain, and retail-EDI relationships rather than
  through a documented internet-accessible API. This profile records the
  company's web presence, careers/IR resources, and brand directory for
  the API Evangelist network.
