description: The Clorox Company is a multinational consumer-goods manufacturer best known for its bleach,
  cleaning and disinfecting brands, alongside a portfolio that includes Pine-Sol, Liquid-Plumr, Glad,
  Kingsford, Brita, Burt's Bees and Hidden Valley. Clorox runs no developer program and publishes no API
  documentation, OpenAPI, SDK or portal, and its commercial integration with retailers and suppliers runs
  over EDI and partner agreements rather than a public API. It does nonetheless serve a small, undocumented,
  anonymous first-party REST surface from its corporate site at /wp-json — Clorox-authored tcc/v1 and
  clorox-security/v1 namespaces exposing a Safety Data Sheet index, cleaning-product ingredient disclosure
  records, a CPSC general conformity certificate lookup, a live job feed and consent signalling. A MuleSoft
  Anypoint gateway at api.clorox.com serves partner traffic behind a 403, and Clorox's Anypoint Exchange
  public portal is enabled but publishes zero assets.
apis:
- name: The Clorox Company Product Disclosure & Content API
  description: 'Undocumented first-party REST surface served from The Clorox Company''s corporate WordPress
    site. Two Clorox-authored namespaces sit alongside WordPress core: tcc/v1 exposes a Safety Data Sheet
    index as XML, a country- and brand-filterable index of cleaning-product ingredient disclosure documents,
    a CPSC general conformity certificate lookup keyed on UPC and lot, a live job requisition feed, and
    a DSAR country/region lookup; clorox-security/v1 carries do-not-sell-or-share consent signalling.
    Every read route answers anonymously with no credential. Clorox publishes no documentation, no OpenAPI,
    no SDK and no support commitment for any of it — this profile is the result of probing the provider''s
    own hosts, not of reading a developer portal.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/clorox.png
